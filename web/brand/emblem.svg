<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background tile gradient -->
    <linearGradient id="embBg" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E383E"/>
      <stop offset="50%" stop-color="#09272C"/>
      <stop offset="100%" stop-color="#061C20"/>
    </linearGradient>

    <!-- Metallic border gradient -->
    <linearGradient id="embBorder" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45B8B0" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#17383D"/>
      <stop offset="100%" stop-color="#347E7C" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Blade Facet 1: Illuminated Ice Cyan to Arctic Teal -->
    <linearGradient id="embBladeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BE3DC"/>
      <stop offset="50%" stop-color="#45B8B0"/>
      <stop offset="100%" stop-color="#168C98"/>
    </linearGradient>

    <!-- Blade Facet 2: Oceanic Blue to Deep Petrol Shadow -->
    <linearGradient id="embBladeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168C98"/>
      <stop offset="40%" stop-color="#167D7F"/>
      <stop offset="100%" stop-color="#10434A"/>
    </linearGradient>

    <!-- Play Triangle Top Facet (Arctic Pure White to Ice Cyan) -->
    <linearGradient id="embPlayLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#8BE3DC"/>
      <stop offset="100%" stop-color="#45B8B0"/>
    </linearGradient>

    <!-- Play Triangle Bottom Facet (Arctic Teal to Metallic Teal) -->
    <linearGradient id="embPlayDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B8B0"/>
      <stop offset="60%" stop-color="#168C98"/>
      <stop offset="100%" stop-color="#167D7F"/>
    </linearGradient>

    <!-- Depth shadow -->
    <filter id="embShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#embShadow)">
    <!-- Base squircle tile -->
    <rect x="12" y="12" width="196" height="196" rx="44" fill="url(#embBg)" stroke="url(#embBorder)" stroke-width="2.5"/>
    <rect x="14.5" y="14.5" width="191" height="191" rx="41.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Continuous Diagonal Blade 1 (Top-Left to Bottom-Right) -->
    <!-- Upper ridge facet -->
    <polygon points="52,50 68,46 154,166 138,172" fill="url(#embBladeLight)"/>
    <!-- Lower bevel facet -->
    <polygon points="68,46 84,44 170,164 154,166" fill="url(#embBladeDark)"/>

    <!-- Crossing Shear Blade 2 (Bottom-Left to Top-Right) with precision razor cut -->
    <!-- Lower-Left segment -->
    <polygon points="52,170 84,174 102,142 80,132" fill="url(#embBladeDark)"/>
    <polygon points="52,170 68,172 88,136 80,132" fill="url(#embBladeLight)"/>

    <!-- Upper-Right segment -->
    <polygon points="120,116 138,86 168,48 138,44 112,88" fill="url(#embBladeLight)"/>
    <polygon points="138,86 170,48 154,46 128,84" fill="url(#embBladeDark)"/>

    <!-- Center Faceted Play Arrowhead (The Video Cutting Core) -->
    <polygon points="94,74 152,110 94,110" fill="url(#embPlayLight)"/>
    <polygon points="94,110 152,110 94,146" fill="url(#embPlayDark)"/>
    <!-- Center ridge line reflection -->
    <line x1="94" y1="110" x2="152" y2="110" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
